name: Stock Alert Bot

on:
  schedule:
    # All times in UTC. India (IST) = UTC + 5:30
    # 8:30 AM IST  = 3:00 AM UTC
    - cron: '0 3 * * 1-5'      # Morning report — weekdays only
    # 11:00 AM IST = 5:30 AM UTC
    - cron: '30 5 * * 1-5'     # IPO closing reminder — weekdays only
    # 12:00 PM IST = 6:30 AM UTC
    - cron: '30 6 * * 1-5'     # Midday report — weekdays only
    # 3:45 PM IST  = 10:15 AM UTC
    - cron: '15 10 * * 1-5'    # Evening report — weekdays only
    # Saturday 10:00 AM IST = 4:30 AM UTC Saturday
    - cron: '30 4 * * 6'       # Weekend tip — Saturday only

  # Allows you to run any report manually from the GitHub Actions tab
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Report to run'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - ipo
          - midday
          - evening
          - weekend

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pytz

      - name: Determine report type from schedule
        id: report-type
        run: |
          # If triggered manually, use the input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.report_type }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Determine from current UTC hour/minute which report to run
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          DAY=$(date -u +%u)  # 1=Mon, 6=Sat, 7=Sun

          if [ "$DAY" = "6" ]; then
            echo "type=weekend" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "03" ]; then
            echo "type=morning" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "05" ]; then
            echo "type=ipo" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "06" ]; then
            echo "type=midday" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "10" ]; then
            echo "type=evening" >> $GITHUB_OUTPUT
          else
            echo "type=morning" >> $GITHUB_OUTPUT
          fi

      - name: Run stock alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python bot.py ${{ steps.report-type.outputs.type }}
