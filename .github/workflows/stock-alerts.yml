name: Stock Alert Bot

on:
  schedule:
    # Schedule mapping explicitly tracking Indian Market hours (UTC conversion)
    - cron: '0 3 * * 1-5'   # 8:30 AM IST (Morning Prep Briefing)
    - cron: '30 5 * * 1-5'  # 11:00 AM IST (IPO Status Check Window)
    - cron: '30 6 * * 1-5'  # 12:00 PM IST (Midday Trading Update)
    - cron: '15 10 * * 1-5' # 3:45 PM IST (Post-Market Close Summary & Review)
    - cron: '30 4 * * 6'    # Saturday 10:00 AM IST (Weekend Planning Tip)
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Report to run manually'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - ipo
          - midday
          - evening
          - weekend

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz yfinance

      - name: Determine report type from schedule
        id: report-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.report_type }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          HOUR=$(date -u +%H)
          DAY=$(date -u +%u)
          if [ "$DAY" = "6" ]; then
            echo "type=weekend" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "03" ]; then
            echo "type=morning" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "05" ]; then
            echo "type=ipo" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "06" ]; then
            echo "type=midday" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "10" ]; then
            echo "type=evening" >> $GITHUB_OUTPUT
          else
            echo "type=morning" >> $GITHUB_OUTPUT
          fi

      - name: Run stock alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot.py ${{ steps.report-type.outputs.type }}
