name: Stock Alert Bot

on:
  schedule:
    # 3-Phase Core Algorithmic Schedule (Converted cleanly to UTC from Indian Standard Time)
    - cron: '0 3 * * 1-5'   # 08:30 AM IST -> Pre-Market Compass Briefing (UTC 03:00)
    - cron: '0 4 * * 1-5'   # 09:30 AM IST -> Live Scalping/Breakout Strategy Scanner (UTC 04:00)
    - cron: '0 12 * * 1-5'  # 05:30 PM IST -> Evening Reconciliation & PDF Master Ledger Sync (UTC 12:00)
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Select execution phase for manual override run'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - live
          - evening

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    # CRITICAL: Grants execution agent write tokens to push ledger updates back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz yfinance reportlab

      - name: Determine report type from schedule
        id: report-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.report_type }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Isolate the current triggering UTC hour matrix
          HOUR=$(date -u +%H)
          
          if [ "$HOUR" = "03" ]; then
            echo "type=morning" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "04" ]; then
            echo "type=live" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "12" ]; then
            echo "type=evening" >> $GITHUB_OUTPUT
          else
            echo "type=morning" >> $GITHUB_OUTPUT
          fi

      - name: Run stock alert bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python bot.py ${{ steps.report-type.outputs.type }}

      - name: Persist and Sync Master Ledger Data
        run: |
          git config --global user.name "GitHub Actions Automation Ledger"
          git config --global user.email "actions@github.com"
          
          # Only stage and push if the logging ledger file exists and registers text delta updates
          if [ -f trading_tracker_log.csv ]; then
            git add trading_tracker_log.csv
            git commit -m "Automated ledger sync: $(date +'%Y-%m-%d %H:%M:%S IST') [skip ci]" || echo "No data anomalies logged to commit"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Tracking ledger file skipped or untracked during this pipeline runtime instance."
          fi
